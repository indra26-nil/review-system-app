# -Xmx3G / Metaspace 1G: this box has 12 GB total with ~6 GB available.
# The Flutter template default of -Xmx8G + 4G metaspace can starve the
# Kotlin/AGP daemons here. Raise it if you have the headroom.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Keep the Kotlin compiler daemon small so it coexists with the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx1G
# Gradle 9's configuration cache trips over Flutter's composite `includeBuild`
# plugin loader: "The settings are not yet available for build."
# (org.gradle.composite.internal.DefaultRootBuildState -> isBuildDefinitionMissing)
# The Flutter Gradle plugin does not yet support the cached-settings path.
org.gradle.configuration-cache=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
